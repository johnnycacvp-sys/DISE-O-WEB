<body>
  <header>
    <div class="logo"><h1>AnimeWear<span>Perú</span></h1></div>

      </ul>
    </nav>
  </header>

  <main class="contenedor">
    <h2 class="titulo-seccion">Contáctanos</h2>
    <form class="formulario" onsubmit="event.preventDefault(); alert('Mensaje enviado. ¡Gracias por escribirnos!');">
      <label>Nombre</label>
      <input type="text" required placeholder="Tu nombre">

      <label>Correo</label>
      <input type="email" required placeholder="tucorreo@email.com">

      <label>Asunto</label>
      <input type="text" required placeholder="Consulta sobre pedido">

      <label>Mensaje</label>
      <textarea rows="5" required placeholder="Escribe tu mensaje..."></textarea>

      <button type="submit" class="btn">Enviar mensaje</button>
    </form>

    <div class="info-contacto">
      <h3>Información de contacto</h3>
      <p>📍 Av. Anime 123, Lima – Perú</p>
      <p>📞 +51 999 888 777</p>
      <p>✉️ ventas@animewearperu.com</p>
    </div>
  </main>

  </footer>
